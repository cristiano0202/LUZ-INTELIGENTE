<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastro — Luz Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#070B14',
            card: '#101827',
            card2: '#111827',
            border: '#243044',
            'txt-main': '#F8FAFC',
            'txt-sec': '#94A3B8',
            energy: '#FFD95A',
            info: '#38BDF8',
            success: '#22C55E',
            danger: '#EF4444'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-bg text-txt-main antialiased">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <!-- Logo -->
      <a href="../index.html" class="flex items-center justify-center gap-2 mb-8">
        <svg width="36" height="36" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="30" stroke="#FFD95A" stroke-width="3" fill="none"/>
          <path d="M36 10 L22 34 H32 L28 54 L44 28 H34 Z" fill="#FFD95A"/>
        </svg>
        <span class="text-2xl font-bold">Luz<span class="text-energy">Inteligente</span></span>
      </a>

      <!-- Card -->
      <div class="bg-card border border-border rounded-2xl p-8 shadow-xl shadow-black/30">
        <h1 class="text-2xl font-bold mb-2">Criar conta</h1>
        <p class="text-txt-sec text-sm mb-6">Comece agora a controlar seu consumo de energia.</p>

        <!-- Mensagem -->
        <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

        <form id="formCadastro" class="space-y-4">
          <div>
            <label class="block text-xs text-txt-sec mb-1">Nome completo</label>
            <input type="text" id="name" required
              class="w-full px-4 py-2.5 rounded-lg bg-bg border border-border focus:border-energy focus:outline-none focus:ring-2 focus:ring-energy/30 transition"/>
          </div>
          <div>
            <label class="block text-xs text-txt-sec mb-1">E-mail</label>
            <input type="email" id="email" required
              class="w-full px-4 py-2.5 rounded-lg bg-bg border border-border focus:border-energy focus:outline-none focus:ring-2 focus:ring-energy/30 transition"/>
          </div>
          <div>
            <label class="block text-xs text-txt-sec mb-1">Senha</label>
            <input type="password" id="password" required minlength="6"
              class="w-full px-4 py-2.5 rounded-lg bg-bg border border-border focus:border-energy focus:outline-none focus:ring-2 focus:ring-energy/30 transition"/>
          </div>
          <div>
            <label class="block text-xs text-txt-sec mb-1">Confirmar senha</label>
            <input type="password" id="password2" required minlength="6"
              class="w-full px-4 py-2.5 rounded-lg bg-bg border border-border focus:border-energy focus:outline-none focus:ring-2 focus:ring-energy/30 transition"/>
          </div>

          <button type="submit" id="btnSubmit"
            class="w-full py-3 rounded-lg bg-energy text-bg font-bold hover:brightness-110 transition flex items-center justify-center gap-2">
            <span id="btnText">Criar conta</span>
            <svg id="btnLoader" class="hidden animate-spin h-5 w-5" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"/>
              <path fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"/>
            </svg>
          </button>
        </form>

        <p class="text-center text-sm text-txt-sec mt-6">
          Já tem conta?
          <a href="login.html" class="text-energy hover:underline font-semibold">Entrar</a>
        </p>
        <p class="text-center text-xs text-txt-sec mt-2">
          <a href="../index.html" class="hover:text-energy">← Voltar ao início</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    const form = document.getElementById('formCadastro');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');
    const btnLoader = document.getElementById('btnLoader');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.classList.remove('hidden', 'bg-danger/20', 'text-danger', 'bg-success/20', 'text-success', 'bg-info/20', 'text-info');
      if (type === 'error') msg.classList.add('bg-danger/20', 'text-danger');
      else if (type === 'success') msg.classList.add('bg-success/20', 'text-success');
      else msg.classList.add('bg-info/20', 'text-info');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;

      if (!name || !email || !password) return showMsg('Preencha todos os campos.', 'error');
      if (password.length < 6) return showMsg('A senha deve ter no mínimo 6 caracteres.', 'error');
      if (password !== password2) return showMsg('As senhas não coincidem.', 'error');

      btn.disabled = true;
      btnText.textContent = 'Criando conta...';
      btnLoader.classList.remove('hidden');

     try {
  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: {
        full_name: name
      }
    }
  });

  if (error) {
    console.error('Erro Supabase:', error);

    if (error.message.includes('already registered')) {
      showMsg('Este e-mail já está cadastrado.', 'error');
    } else {
      showMsg('Erro: ' + error.message, 'error');
    }

    return;
  }

  console.log('Cadastro realizado:', data);

  if (data.session) {
    showMsg('Conta criada! Redirecionando...', 'success');

    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);

  } else {
    showMsg(
      'Conta criada! Verifique seu e-mail para confirmar o cadastro.',
      'success'
    );

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2500);
  }

} catch (erro) {
  console.error('Falha de conexão:', erro);

  showMsg(
    'Não foi possível conectar ao Supabase. Veja o Console do navegador.',
    'error'
  );

} finally {
  btn.disabled = false;
  btnText.textContent = 'Criar conta';
  btnLoader.classList.add('hidden');
}
      }
    });
  </script>
  
</body>
</html>
