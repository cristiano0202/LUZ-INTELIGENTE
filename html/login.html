<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Luz Inteligente</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-center mb-2">Entrar</h1>
    <p class="text-center text-gray-400 mb-8">Luz Inteligente</p>

    <div
      id="login-error"
      class="hidden mb-4 rounded-lg border border-red-500 bg-red-500/10 p-3 text-red-400 text-sm"
    ></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium mb-1">
          E-mail
        </label>

        <input
          id="email"
          name="email"
          type="email"
          required
          class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          placeholder="seu@email.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium mb-1">
          Senha
        </label>

        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          placeholder="Sua senha"
        />
      </div>

      <button
        id="login-button"
        type="submit"
        class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 font-semibold transition"
      >
        Entrar
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-400">
      Não tem conta?
      <a
        href="cadastro.html"
        class="text-emerald-400 hover:text-emerald-300"
      >
        Criar conta
      </a>
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>

  <script>
    async function initLogin() {
      const errorEl = document.getElementById("login-error");
      const button = document.getElementById("login-button");
      const form = document.getElementById("login-form");

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
      }

      function clearError() {
        errorEl.textContent = "";
        errorEl.classList.add("hidden");
      }

      // Se já existir sessão aberta, vai direto para o dashboard.
      const { data, error: sessionError } =
        await window.supabaseClient.auth.getSession();

      if (!sessionError && data.session) {
        window.location.href = "dashboard.html";
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearError();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        button.disabled = true;
        button.textContent = "Entrando...";

        const { error } =
          await window.supabaseClient.auth.signInWithPassword({
            email,
            password,
          });

        button.disabled = false;
        button.textContent = "Entrar";

        if (error) {
          showError(error.message || "Não foi possível entrar.");
          return;
        }

        window.location.href = "dashboard.html";
      });
    }

    initLogin();
  </script>
</body>
</html>
