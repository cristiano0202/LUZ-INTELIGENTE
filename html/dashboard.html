<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Luz Inteligente</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-950 text-gray-100">
  <header class="border-b border-gray-800 bg-gray-900">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-xl font-bold">Luz Inteligente</h1>
        <p class="text-sm text-gray-400">Dashboard</p>
      </div>

      <nav class="flex flex-wrap items-center gap-3 text-sm">
        <a
          href="dashboard.html"
          class="rounded-lg bg-emerald-600 px-4 py-2 font-semibold"
        >
          Dashboard
        </a>

        <a
          href="calculadora.html"
          class="rounded-lg border border-gray-700 px-4 py-2 hover:bg-gray-800"
        >
          Calculadora
        </a>

        <a
          href="historico.html"
          class="rounded-lg border border-gray-700 px-4 py-2 hover:bg-gray-800"
        >
          Histórico
        </a>

        <button
          id="logout-button"
          type="button"
          class="rounded-lg border border-red-500 px-4 py-2 text-red-400 hover:bg-red-500/10"
        >
          Sair
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <section
      id="dashboard-loading"
      class="rounded-2xl border border-gray-800 bg-gray-900 p-6"
    >
      Carregando...
    </section>

    <section
      id="dashboard-error"
      class="hidden rounded-2xl border border-red-500 bg-red-500/10 p-6 text-red-400"
    ></section>

    <section id="dashboard-content" class="hidden space-y-6">
      <section class="rounded-2xl border border-gray-800 bg-gray-900 p-6">
        <p class="text-sm text-gray-400">Usuário logado</p>

        <h2
          id="dashboard-user-name"
          class="mt-1 text-2xl font-semibold"
        >
          Carregando usuário...
        </h2>

        <p
          id="dashboard-email"
          class="mt-1 text-sm text-gray-400"
        ></p>
      </section>

      <section class="grid gap-4 md:grid-cols-2">
        <a
          href="calculadora.html"
          class="rounded-2xl border border-gray-800 bg-gray-900 p-6 transition hover:border-emerald-500"
        >
          <h3 class="text-lg font-semibold">Novo cálculo</h3>
          <p class="mt-2 text-sm text-gray-400">
            Calcule o consumo e o custo de equipamentos elétricos.
          </p>
        </a>

        <a
          href="historico.html"
          class="rounded-2xl border border-gray-800 bg-gray-900 p-6 transition hover:border-emerald-500"
        >
          <h3 class="text-lg font-semibold">Histórico</h3>
          <p class="mt-2 text-sm text-gray-400">
            Veja, edite ou exclua seus cálculos salvos.
          </p>
        </a>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
