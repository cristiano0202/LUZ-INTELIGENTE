<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Histórico — Luz Inteligente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        bg:'#070B14', card:'#101827', card2:'#111827', border:'#243044',
        'txt-main':'#F8FAFC','txt-sec':'#94A3B8',
        energy:'#FFD95A', info:'#38BDF8', success:'#22C55E', danger:'#EF4444'
      }}}
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen bg-bg text-txt-main">
  <div class="flex">
    <aside id="sidebar" class="hidden lg:flex flex-col w-64 min-h-screen bg-card border-r border-border p-4">
      <a href="../index.html" class="flex items-center gap-2 px-2 py-3">
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="30" stroke="#FFD95A" stroke-width="3" fill="none"/>
          <path d="M36 10 L22 34 H32 L28 54 L44 28 H34 Z" fill="#FFD95A"/>
        </svg>
        <span class="font-bold">Luz<span class="text-energy">Inteligente</span></span>
      </a>
      <nav class="mt-6 space-y-1">
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-txt-sec hover:bg-bg transition">📊 Dashboard</a>
        <a href="calculadora.html" class="flex items-center gap-3 px-3 py-2 rounded-lg text-txt-sec hover:bg-bg transition">⚡ Calculadora</a>
        <a href="historico.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-energy/10 text-energy">📅 Histórico</a>
      </nav>
      <div class="mt-auto border-t border-border pt-4">
        <button id="btnLogout" class="w-full px-3 py-2 rounded-lg border border-border text-txt-sec hover:bg-danger hover:text-white hover:border-danger transition">🚪 Sair</button>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <header class="flex items-center justify-between p-4 lg:p-6 border-b border-border bg-card">
        <div>
          <h1 class="text-xl md:text-2xl font-bold">Histórico</h1>
          <p class="text-sm text-txt-sec">Todos os seus cálculos salvos em ordem cronológica.</p>
        </div>
        <button id="btnMenu" class="lg:hidden p-2 rounded-lg border border-border">☰</button>
      </header>

      <section class="p-4 lg:p-6">
        <div class="bg-card border border-border rounded-2xl p-6">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-xs text-txt-sec border-b border-border">
                <tr class="text-left">
                  <th class="py-2">Data</th>
                  <th>Equipamento</th>
                  <th>Potência</th>
                  <th>Consumo (kWh)</th>
                  <th>Custo (R$)</th>
                  <th class="text-right">Ações</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="6" class="py-4 text-center text-txt-sec">Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    (async () => {
      const user = await requireAuth('login.html');
      if (!user) return;

      document.getElementById('btnLogout').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = 'login.html';
      });
      document.getElementById('btnMenu').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('hidden');
        document.getElementById('sidebar').classList.toggle('fixed');
        document.getElementById('sidebar').classList.toggle('inset-0');
        document.getElementById('sidebar').classList.toggle('z-50');
      });

      const { data, error } = await supabase
        .from('calculations')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('tbody');
      if (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-danger">${error.message}</td></tr>`;
        return;
      }
      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="py-4 text-center text-txt-sec">Nenhum cálculo salvo.</td></tr>`;
        return;
      }

      tbody.innerHTML = data.map(c => {
        const d = new Date(c.created_at).toLocaleDateString('pt-BR');
        return `
          <tr class="border-b border-border hover:bg-bg/40">
            <td class="py-2 text-txt-sec">${d}</td>
            <td class="font-medium">${c.equipment_name}</td>
            <td>${c.power_watts} W</td>
            <td class="text-energy font-semibold">${Number(c.monthly_consumption).toFixed(2)}</td>
            <td class="text-success">R$ ${Number(c.monthly_cost).toFixed(2).replace('.', ',')}</td>
            <td class="text-right">
              <button onclick="del('${c.id}')" class="px-2 py-1 rounded text-xs border border-danger/50 text-danger hover:bg-danger hover:text-white transition">Excluir</button>
            </td>
          </tr>`;
      }).join('');
    })();

    async function del(id) {
      if (!confirm('Excluir este cálculo?')) return;
      const { error } = await supabase.from('calculations').delete().eq('id', id);
      if (!error) window.location.reload();
    }
    window.del = del;
  </script>
</body>
</html>
